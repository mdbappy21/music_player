version: 1.0.1+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  permission_handler: ^12.0.1
  on_audio_query: ^2.9.0
  just_audio: ^0.10.4
  hive: ^2.2.3
