  path_provider: ^2.1.5
  audio_service: ^0.18.18
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.2.2
  firebase_core: ^4.1.0
  cloud_firestore: ^6.0.1
  package_info_plus: ^8.3.1
  url_launcher: ^6.3.2
  youtube_player_flutter: ^9.1.2
  http: ^1.5.0
  youtube_explode_dart: ^2.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.5.4

